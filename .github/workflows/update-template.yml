name: Update Template CI
# 🔴 NO SCHEDULE. This workflow is run deliberately or not at all.
#
# Its job is to regenerate every file in .github/workflows/ from the upstream
# template. On 2026-08-25 it ran on the old daily cron and did exactly what it
# is designed to do — and what we do not want:
#
#     Removed legacy .github/workflows
#     Added new .github/workflows          <- would revert every SHA pin
#     Removed old data from api            <- the response-time history
#     Removed old data from graphs
#     Removed old data from history        <- the uptime record itself
#     ERROR Permission to a-abdi/sabzgin-uptime.git denied to github-actions[bot]
#
# The push was refused because `permissions: contents: read` below leaves the
# token unable to write, so nothing was lost — api/, graphs/ and history/ are
# all still there and the pins are intact. The guard worked.
#
# What remained was noise: a guaranteed failure, every night, emailing the
# owner about a repository whose entire purpose is to email the owner when
# something is wrong. That is how a real alert gets filtered.
#
# The trigger is removed rather than the workflow, so taking an upstream update
# stays possible — run it by hand, restore `contents: write` for that run,
# review the regenerated diff, and re-pin.
on:
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
# 🔴 READ-ONLY ON PURPOSE. THIS WORKFLOW IS DELIBERATELY UNABLE TO ACT.
#
# Its job is to REGENERATE every file in .github/workflows/ from the upstream
# template, daily. That would silently revert the SHA pins and these very
# permission blocks — an auto-updater that undoes pinning makes the pinning
# decorative, and the config would drift back to moving refs with nobody
# noticing.
#
# It already could not do this today: it writes to .github/workflows/, which
# GITHUB_TOKEN is forbidden from touching, so it fails. But that is protection
# by ACCIDENT — it would start working the moment a GH_PAT with the `workflow`
# scope is added, which is exactly the kind of change made for an unrelated
# reason months later.
#
# `contents: read` makes the intent explicit and durable instead.
#
# To take upstream template updates deliberately: run it manually, or restore
# `contents: write`, review the regenerated diff, and re-pin.
permissions:
  contents: read

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update template
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # master @ 2026-08-24 (identical to v1.43.15)
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
